<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>OADTR - Open Android Device Tree Repository</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><b>OADTR</b> Open Android Device Tree Repository <a href="index.html">Home</a><a href="create-device.html">/create-device</a><a id="gh" href="#">GitHub</a></header>
<main>
<div class="tabs"><a href="#devices" id="t1">Devices</a><a href="#pending" id="t2">Pending devices</a></div>
<input id="q" placeholder="Filter by brand, name, model or codename" style="margin-bottom:8px">
<p id="st" class="small">Loading...</p>
<table><thead id="hd"></thead><tbody id="bd"></tbody></table>
<p class="small">Devices = approved (in <code>devices/</code> or closed as completed [DTU] issues). Pending = open [DTU] issues. <a href="docs/ISSUE_GUIDE.md">How to prepare an issue</a></p>
</main>
<script src="app.js"></script>
<script>
$("#gh").href="https://github.com/"+REPO;
let DEV=[],PEN=[];
async function load(){
  const repo=await fetch("devices/index.json").then(r=>r.json()).catch(()=>[]);
  try{
    const cl=(await issues("closed")).filter(i=>i.state_reason==="completed").map(i=>{const f=parse(i.body);
      return{brand:f["Brand"],name:f["Marketing name"],model:f["Model number(s)"],codename:f["Codename"],url:i.html_url,src:"#"+i.number}});
    DEV=[...repo.map(d=>({...d,src:"repo",url:"devices/index.json"})),...cl];
    PEN=await issues("open");$("#st").textContent="";
  }catch(e){DEV=repo.map(d=>({...d,src:"repo"}));$("#st").textContent="Could not reach GitHub: "+e.message}
  draw();
}
function draw(){
  const p=location.hash==="#pending",q=$("#q").value.toLowerCase();
  $("#t1").className=p?"":"on";$("#t2").className=p?"on":"";
  if(!p){
    $("#hd").innerHTML="<tr><th>Brand</th><th>Name</th><th>Model</th><th>Codename</th><th>Source</th></tr>";
    $("#bd").innerHTML=DEV.filter(d=>JSON.stringify(d).toLowerCase().includes(q)).map(d=>`<tr><td>${esc(d.brand)}</td><td>${esc(d.name)}</td><td>${esc(d.model)}</td><td>${esc(d.codename)}</td><td><a href="${esc(d.url)}">${esc(d.src)}</a></td></tr>`).join("")||"<tr><td colspan=5>No devices yet.</td></tr>";
  }else{
    $("#hd").innerHTML="<tr><th>Issue</th><th>Title</th><th>Opened</th><th>By</th></tr>";
    $("#bd").innerHTML=PEN.filter(i=>i.title.toLowerCase().includes(q)).map(i=>`<tr><td><a href="${esc(i.html_url)}">#${i.number}</a></td><td>${esc(i.title)}</td><td>${i.created_at.slice(0,10)}</td><td>${esc(i.user.login)}</td></tr>`).join("")||"<tr><td colspan=4>No pending devices.</td></tr>";
  }
}
addEventListener("hashchange",draw);$("#q").oninput=draw;load();
</script></body></html>
